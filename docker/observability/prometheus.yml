global:
  scrape_interval: 5s
scrape_configs:
  - job_name: checkout-demo
    static_configs:
      - targets: ['demo-metrics:9101']
        labels:
          service: checkout
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: checkout-recovery-lab
    static_configs:
      - targets: ["host.docker.internal:9201"]
