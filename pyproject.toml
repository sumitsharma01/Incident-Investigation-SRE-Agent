[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-investigation-sre-agent"
version = "0.4.0"
description = "Incident investigation API with a demo dashboard and optional OpenSRE backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
screenshots = [
  "playwright>=1.50.0",
]
llm = [
  "openai>=1.0.0",
]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools]
packages = ["app", "app.api", "app.agent", "app.core", "app.tools", "app.workspace"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
"app.workspace" = ["*.html"]
