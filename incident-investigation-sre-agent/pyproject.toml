[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-investigation-sre-agent"
version = "0.1.0"
description = "AI-assisted SRE incident investigation assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
llm = [
  "openai>=1.0.0",
]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools]
packages = ["app", "app.api", "app.agent", "app.core", "app.tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
